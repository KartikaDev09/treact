<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>treact</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="row nav__row">
          <div class="nav__logo">
            <img
              class="nav__logo--img"
              src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"
              alt="treat logo blue"
            />
            <div class="nav__logo--title">Treact</div>
          </div>
          <ul class="nav__links">
            <li><a href="#" class="nav__link">About</a></li>
            <li><a href="#" class="nav__link">Blog</a></li>
            <li><a href="#" class="nav__link">pricing</a></li>
            <li><a href="#" class="nav__link">Contact Us</a></li>
            <li><a href="#" class="nav__link nav__link--login">Login</a></li>
            <li><a href="#" class="nav__link nav__link--primary">Sign Up</a></li>
          </ul>
        </div>
      </nav>

      <header>
        <div class="container">
          <div class="row header__row">
            <div class="header__description">
              <h1 class="header__title">
                Beautiful React Templates <span class="purple">for you.</span>
              </h1>
              <p class="header__para">
                Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.
              </p>
              <form class="header__form">
                <input type="email" placeholder="Your E-mail Address">
                <button class="btn btn__header" type="submit">Get Started</button>
              </form>
              <p class="header__customer--title">Our Trusted Customers</p>
              <img class="header__customer--img" src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="">
            </div>
            <figure class="header__img--wrapper">
              <img class="header__img" src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt="design illustration">
            </figure>
          </div>
        </div>
      </header>
    </section>
  </body>
</html>
